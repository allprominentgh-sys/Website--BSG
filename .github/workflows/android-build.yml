
name: BEST SALES GHANA Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/admin-support-staff-management
    paths:
      - "mobile-app/**"
      - ".github/workflows/android-build.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install mobile dependencies
        working-directory: mobile-app
        run: npm install

      - name: Generate Android project
        working-directory: mobile-app
        run: npx cap add android

      - name: Synchronize Capacitor
        working-directory: mobile-app
        run: npx cap sync android

      - name: Build Android APK
        working-directory: mobile-app/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BEST-SALES-GHANA-Android-APK
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
