
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#123B82" />
  <title>BEST SALES GHANA</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f4f7fc;
      color: #14233d;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    main { width: 100%; max-width: 420px; }
    .logo {
      width: 78px;
      height: 78px;
      display: grid;
      place-items: center;
      margin: 0 auto 22px;
      border-radius: 22px;
      background: #123B82;
      color: white;
      font-size: 25px;
      font-weight: 800;
    }
    h1 { color: #123B82; font-size: 27px; }
    p { color: #64748b; line-height: 1.6; }
    .status { margin: 28px 0; }
    a {
      display: block;
      padding: 17px;
      border-radius: 12px;
      background: #123B82;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
    small { display: block; margin-top: 25px; color: #8995a8; }
  </style>
</head>
<body>
  <main>
    <div class="logo">BSG</div>
    <h1>BEST SALES GHANA</h1>
    <p>Your marketplace for discovering products and connecting with sellers across Ghana.</p>
    <p class="status" id="status">Opening the marketplace...</p>
    <a href="https://www.bestsalesgh.com/">OPEN MARKETPLACE</a>
    <small>ALL PROMINENT GHANA LIMITED</small>
  </main>

  <script>
    setTimeout(() => {
      window.location.replace("https://www.bestsalesgh.com/");
    }, 900);
  </script>
</body>
</html>
